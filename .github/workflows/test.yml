name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    env:
      AGE_VERSION: "1.3.1"

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # Install the reference age CLI so the Interop_* tests actually run (they skip when it is absent).
      # Extract to RUNNER_TEMP, not the workspace: the archive's lowercase "age/" dir would collide with
      # the repo's "Age/" directory on case-insensitive macOS/Windows filesystems.
      - name: Install age CLI (Linux)
        if: runner.os == 'Linux'
        run: |
          curl -sSL "https://github.com/FiloSottile/age/releases/download/v${AGE_VERSION}/age-v${AGE_VERSION}-linux-amd64.tar.gz" | tar -xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/age" >> "$GITHUB_PATH"

      - name: Install age CLI (macOS)
        if: runner.os == 'macOS'
        run: |
          curl -sSL "https://github.com/FiloSottile/age/releases/download/v${AGE_VERSION}/age-v${AGE_VERSION}-darwin-arm64.tar.gz" | tar -xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/age" >> "$GITHUB_PATH"

      - name: Install age CLI (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $url = "https://github.com/FiloSottile/age/releases/download/v$env:AGE_VERSION/age-v$env:AGE_VERSION-windows-amd64.zip"
          Invoke-WebRequest $url -OutFile "$env:RUNNER_TEMP\age.zip"
          Expand-Archive "$env:RUNNER_TEMP\age.zip" -DestinationPath "$env:RUNNER_TEMP" -Force
          "$env:RUNNER_TEMP\age" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Restore dependencies
        run: dotnet restore

      # -p:TreatWarningsAsErrors turns compiler and analyzer warnings (CS1591 doc
      # gaps, RS0016 undeclared public API, ...) into errors. CI is the reliable
      # gate for these: local incremental builds don't re-emit warnings from
      # unchanged files. publish.yml is deliberately not gated so AOT/trim
      # warnings can never block a release.
      - name: Build
        run: dotnet build --no-restore -p:TreatWarningsAsErrors=true

      - name: Test
        run: dotnet test --no-build --collect:"XPlat Code Coverage"

      # Upload from every platform and let Codecov merge them. This used to run on Linux alone,
      # on the assumption that coverage is identical everywhere — which stopped being true once
      # PluginLocator gained genuinely platform-specific code (PATHEXT expansion and the Windows
      # branch of the executable check simply cannot execute on Linux). A Linux-only report shows
      # those lines as untested when they are in fact covered by the Windows job.
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: ${{ matrix.os }}

  # Runs the whole suite + CCTV vectors through the managed BouncyCastle AEAD backend —
  # the same path Blazor/WASM takes. Managed code is OS-independent, so one OS is enough.
  test-portable:
    runs-on: ubuntu-latest

    env:
      AGE_VERSION: "1.3.1"

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install age CLI
        run: |
          curl -sSL "https://github.com/FiloSottile/age/releases/download/v${AGE_VERSION}/age-v${AGE_VERSION}-linux-amd64.tar.gz" | tar -xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/age" >> "$GITHUB_PATH"

      - name: Test (portable / BouncyCastle backend)
        run: dotnet test -c Release -p:ForcePortableAead=true -p:TreatWarningsAsErrors=true
